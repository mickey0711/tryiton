alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED

databases:
- engine: PG
  name: db
  version: "17"

domains:
- domain: tryit4u.ai
  type: PRIMARY

features:
- buildpack-stack=ubuntu-22

ingress:
  rules:
  # Next.js static assets — served from Express (DO CDN doesn't upload _next/static/)
  - component:
      name: tryiton
    match:
      path:
        prefix: /_next
  # Next.js pages (static site)
  - component:
      name: web
    match:
      path:
        prefix: /login
  - component:
      name: web
    match:
      path:
        prefix: /register
  - component:
      name: web
    match:
      path:
        prefix: /saved
  - component:
      name: web
    match:
      path:
        prefix: /account
  - component:
      name: web
    match:
      path:
        prefix: /s
  - component:
      name: web
    match:
      path:
        prefix: /auth
  # .html versions of Next.js pages (CDN path-segment prefix won't match /login.html via /login rule)
  - component:
      name: web
    match:
      path:
        prefix: /login.html
  - component:
      name: web
    match:
      path:
        prefix: /register.html
  - component:
      name: web
    match:
      path:
        prefix: /saved.html
  - component:
      name: web
    match:
      path:
        prefix: /account.html
  - component:
      name: web
    match:
      path:
        prefix: /s.html
  - component:
      name: web
    match:
      path:
        prefix: /auth/success.html
  - component:
      name: web
    match:
      path:
        prefix: /404.html
  # Everything else → Express (original landing page + API)
  - component:
      name: tryiton
    match:
      path:
        prefix: /

name: tryiton-app
region: fra

static_sites:
- build_command: |
    cd apps/web && npm install && npm run build
  environment_slug: node-js
  envs:
  - key: NEXT_PUBLIC_API_URL
    scope: BUILD_TIME
    value: https://tryit4u.ai
  github:
    branch: main
    deploy_on_push: true
    repo: mickey0711/tryiton
  name: web
  output_dir: apps/web/out
  source_dir: /

